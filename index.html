<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="tetris-app">
    <section class="game-area">
      <header class="panel">
        <h1>테트리스</h1>
        <div class="stats">
          <div class="stat">
            <span class="label">점수</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="stat">
            <span class="label">레벨</span>
            <span id="level" class="value">1</span>
          </div>
          <div class="stat">
            <span class="label">줄</span>
            <span id="lines" class="value">0</span>
          </div>
        </div>
        <button id="restart" type="button">다시 시작</button>
      </header>
      <canvas id="board" width="300" height="600" aria-label="테트리스 게임 보드" role="img"></canvas>
    </section>
    <aside class="info">
      <h2>조작 방법</h2>
      <ul>
        <li><strong>← →</strong>: 좌우 이동</li>
        <li><strong>↑</strong>: 회전</li>
        <li><strong>↓</strong>: 빠르게 내리기</li>
        <li><strong>Space</strong>: 즉시 떨어뜨리기</li>
      </ul>
      <p class="hint">게임은 시간이 지날수록 빨라집니다. 많은 줄을 지워 높은 점수를 노려보세요!</p>
    </aside>
  </main>
  <footer class="credits">
    <p>Made with ❤️ using HTML, CSS, and JavaScript.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
